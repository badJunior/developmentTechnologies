name: booking

services:
  worker:
    build:
      context: .
    command: ["python", "-m", "booking.workers.notifier"]
    environment:
      DATABASE_URL: postgresql://booking:booking@db:5432/booking
      BROKER_URL: amqp://booking:booking@broker:5672/
      CACHE_URL: redis://cache:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped
  broker:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: booking
      RABBITMQ_DEFAULT_PASS: booking
    ports:
      - "15672:15672"
      - "5672:5672" 
    volumes:
      - brokerdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  cache:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - cachedata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.18
    ports:
      - "8025:8025"
  api:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://booking:booking@db:5432/booking
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8080
      BROKER_URL: amqp://booking:booking@broker:5672/   
      CACHE_URL: redis://cache:6379/0      
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
  cachedata:
  brokerdata:
 